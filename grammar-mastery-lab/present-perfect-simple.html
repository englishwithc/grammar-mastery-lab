<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Present Perfect Mastery Lab</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root{
            --subject:#3498db;
            --aux:#2ecc71;
            --verb:#e67e22;
            --obj:#95a5a6;
            --error:#e74c3c;
            --bg:#f4f7f6;
            --txt:#2c3e50;
        }
        body{
            font-family:Segoe UI,Tahoma,Geneva, Verdana,sans-serif;
            background:var(--bg);
            color:var(--txt);
            margin:0;
            display:flex;
            justify-content:center;
            padding:20px;
        }
        .container{
            max-width:1000px;
            width:100%;
            background:#fff;
            border-radius:15px;
            padding:30px;
            box-shadow:0 10px 25px rgba(0,0,0,.1);
        }
        h1{ text-align:center; color:#34495e; margin-bottom:5px; }
        .step-nav{
            display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-bottom:20px;
        }
        button{
            padding:8px 14px;
            background:#34495e;
            color:#fff;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-weight:bold;
            transition:.2s;
        }
        button:hover{background:#2c3e50;}
        button.active{background:#3498db; outline:3px solid #b3d4fc;}
        .zone{display:none; animation:fade .4s;}
        @keyframes fade{from{opacity:0;}to{opacity:1;}}
        /* ---------- STEP 1 ---------- */
        .word-bank{
            display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding:15px;
            border:2px dashed #ccc; border-radius:10px; margin-bottom:20px; min-height:60px;
        }
        .word-tile{
            padding:6px 12px;
            background:#fff;
            border:2px solid #ddd;
            border-radius:5px;
            cursor:grab;
            user-select:none;
        }
        .drop-zones{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
            gap:12px;
        }
        .zone-box{
            border:2px solid #ddd;
            border-radius:10px;
            padding:12px;
            min-height:110px;
            text-align:center;
        }
        .zone-box h3{margin:0;font-size:1rem;}
        .zone-box.subject{border-color:var(--subject);}
        .zone-box.aux{border-color:var(--aux);}
        .zone-box.verb{border-color:var(--verb);}
        .zone-box.obj{border-color:var(--obj);}
        /* ---------- STEP 2 ---------- */
        .controls{display:flex; justify-content:center; gap:12px; margin-bottom:30px;}
        .sentence{display:flex; flex-wrap:wrap; justify-content:center; gap:12px; font-size:1.5rem; font-weight:bold; margin:30px 0;}
        .slot{
            padding:12px 22px;
            border-radius:8px;
            color:#fff;
            cursor:pointer;
            transition:.2s;
            border-bottom:5px solid rgba(0,0,0,.2);
        }
        .slot:hover{transform:translateY(-5px);}
        .slot.subject{background:var(--subject);}
        .slot.aux{background:var(--aux);}
        .slot.verb{background:var(--verb);}
        .slot.obj{background:var(--obj);}
        .slot.not{background:var(--error);}
        /* ---------- STEP 3 ---------- */
        .mistake-card{
            background:#fff5f5;
            border:2px solid #feb2b2;
            border-radius:10px;
            max-width:620px;
            margin:auto;
            padding:20px;
            text-align:center;
        }
        .mistake-sentence{font-size:1.8rem; margin-bottom:15px;}
        .bad-word{
            padding:2px 6px;
            border-radius:4px;
            cursor:pointer;
            border-bottom:2px dashed #ccc;
            transition:.2s;
        }
        .bad-word:hover{background:#fed7d7;}
        .bad-word.correct{background:var(--aux);color:#fff;border-bottom:none;}
        .bad-word.wrong{background:var(--error);color:#fff;}
        #explain{margin-top:15px;padding:12px;border-radius:6px;background:#fff;border:1px solid #ddd;display:none;}
        /* ---------- STEP 4 ---------- */
        .scramble{
            text-align:center;
            margin-top:15px;
        }
        .pool,.answer,.trash{
            min-height:60px;
            border:2px solid #ddd;
            border-radius:10px;
            padding:12px;
            margin:12px auto;
            display:flex;
            gap:8px;
            flex-wrap:wrap;
            justify-content:center;
            background:#fafafa;
        }
        .trash{border-color:var(--error);background:#fff5f5;}
        .trash-label{color:var(--error);font-weight:bold;margin-bottom:5px;}
        .scramble-tile{
            padding:8px 16px;
            background:#fff;
            border:2px solid #34495e;
            border-radius:5px;
            cursor:pointer;
            user-select:none;
        }
        .scramble-tile:hover{background:#eee;}
        .feedback{font-weight:bold;margin-top:12px;}
    </style>
</head>
<body>
<div class="container">
    <h1>Present Perfect Mastery Lab</h1>

    <div class="step-nav">
        <button id="b1" class="active" onclick="showStep(1)">1️⃣ Classify</button>
        <button id="b2" onclick="showStep(2)">2️⃣ Build</button>
        <button id="b3" onclick="showStep(3)">3️⃣ Detect Errors</button>
        <button id="b4" onclick="showStep(4)">4️⃣ Reorder</button>
    </div>

    <!-- STEP 1 – Classification -->
    <div id="step1" class="zone">
        <p style="text-align:center;">Drag each word into the correct box.</p>
        <div class="word-bank" id="bank"></div>
        <div class="drop-zones">
            <div class="zone-box subject" id="subject" ondrop="drop(event)" ondragover="allow(event)"><h3>Subject</h3></div>
            <div class="zone-box aux" id="aux" ondrop="drop(event)" ondragover="allow(event)"><h3>Auxiliary</h3></div>
            <div class="zone-box verb" id="verb" ondrop="drop(event)" ondragover="allow(event)"><h3>Past Participle</h3></div>
            <div class="zone-box obj" id="obj" ondrop="drop(event)" ondragover="allow(event)"><h3>Object/Complement</h3></div>
        </div>
        <div id="class-msg" style="text-align:center;margin-top:15px;font-weight:bold;"></div>
    </div>

    <!-- STEP 2 – Sentence Builder -->
    <div id="step2" class="zone">
        <div class="controls">
            <button onclick="setMode('affirm')">Affirmative (+)</button>
            <button onclick="setMode('neg')">Negative (-)</button>
            <button onclick="setMode('ques')">Question (?)</button>
        </div>
        <div class="sentence" id="sentence"></div>
        <p style="text-align:center;font-style:italic;color:#7f8c8d;">Click a block to cycle through alternatives.</p>
    </div>

    <!-- STEP 3 – Mistake Detector -->
    <div id="step3" class="zone">
        <div class="mistake-card">
            <p><strong>Find the wrong word</strong></p>
            <div class="mistake-sentence" id="mistake-sentence"></div>
            <div id="explain"></div>
            <button id="nextErr" style="margin-top:12px;display:none;" onclick="nextError()">Next →</button>
        </div>
    </div>

    <!-- STEP 4 – Reorder Exercise -->
    <div id="step4" class="zone">
        <div class="scramble">
            <p>Arrange the words to a correct sentence. Place the intruder in the red box.</p>
            <div class="pool" id="pool"></div>
            <div class="answer" id="answer"></div>
            <div class="trash-label">Incorrect Word</div>
            <div class="trash" id="trash"></div>
            <button onclick="checkScramble()">Check</button>
            <button onclick="loadScramble()">New</button>
            <div class="feedback" id="scramble-feedback"></div>
        </div>
    </div>
</div>

<script>
/* ---------- DATA ---------- */
const data = {
    subject:["I","You","He","She","It","We","They"],
    aux:["have","has"],
    verb:["visited","eaten","seen","finished","bought","studied"],
    obj:["Paris","the pizza","the movie","the homework","a new car","English"]
};

const errors = [
    {arr:["He","have","visited","Paris"],wrong:1,correct:"has",msg:"3rd‑person singular subjects need **has**."},
    {arr:["I","has","finished","the homework"],wrong:1,correct:"have",msg:"I/You/We/They always use **have**."},
    {arr:["They","have","study","English"],wrong:2,correct:"studied",msg:"Present Perfect requires the past‑participle (studied)."},
    {arr:["Has","you","seen","the movie"],wrong:0,correct:"Have",msg:"In questions, *you* also uses **have**."}
];

const scrambles = [
    {words:["has","English","studied","it","have"],correct:["it","has","studied","English"],intruder:"have"},
    {words:["visited","They","not","have","Paris","has"],correct:["They","have","not","visited","Paris"],intruder:"has"},
    {words:["she","seen","movie","has","the","have"],correct:["has","she","seen","the","movie"],intruder:"have"}
];

/* ---------- STATE ---------- */
let mood = 'affirm';
let selection = {subject:0,aux:0,verb:0,obj:0};
let errIdx = 0;
let scrambleIdx = 0;

/* ---------- NAVIGATION ---------- */
function showStep(n){
    document.querySelectorAll('.zone').forEach(z=>z.style.display='none');
    document.getElementById(`step${n}`).style.display='block';
    document.querySelectorAll('.step-nav button').forEach((b,i)=>b.classList.toggle('active',i===n-1));
    if(n===2) renderSentence();
    if(n===3) loadError();
    if(n===4) loadScramble();
}

/* ---------- STEP 1 ---------- */
function initStep1(){
    const bank = document.getElementById('bank');
    let pool=[];
    for(let cat in data) data[cat].forEach(w=>pool.push({w,cat}));
    pool.sort(()=>Math.random()-0.5);
    pool.forEach((obj,i)=>{
        const d=document.createElement('div');
        d.className='word-tile';
        d.id='wt'+i;
        d.textContent=obj.w;
        d.dataset.cat=obj.cat;
        d.draggable=true;
        d.ondragstart=e=>e.dataTransfer.setData('text',d.id);
        bank.appendChild(d);
    });
}
function allow(e){e.preventDefault();}
function drop(e){
    e.preventDefault();
    const id=e.dataTransfer.getData('text');
    const tile=document.getElementById(id);
    const target=e.target.closest('.zone-box');
    if(!target) return;
    if(tile.dataset.cat===target.id){
        target.appendChild(tile);
        tile.style.background='#dff0d8';
        setTimeout(()=>tile.style.background='white',400);
        checkDone();
    }else{
        tile.style.background='#f2dede';
        setTimeout(()=>tile.style.background='white',400);
    }
}
function checkDone(){
    const remaining=document.getElementById('bank').children.length;
    if(remaining===0){
        document.getElementById('class-msg').textContent='✅ All placed! Move to the next step.';
    }
}

/* ---------- STEP 2 ---------- */
function setMode(m){
    mood=m;
    renderSentence();
}
function getAux(){
    const sub=data.subject[selection.subject];
    return (sub==="He"||sub==="She"||sub==="It")?"has":"have";
}
function renderSentence(){
    const arena=document.getElementById('sentence');
    arena.innerHTML='';
    const s=data.subject[selection.subject];
    const a=getAux();
    const v=data.verb[selection.verb];
    const o=data.obj[selection.obj];
    const parts = (mood==='affirm')?
        [{txt:s,cls:'subject'},{txt:a,cls:'aux'},{txt:v,cls:'verb'},{txt:o,cls:'obj'}]:
        (mood==='neg')?
        [{txt:s,cls:'subject'},{txt:a,cls:'aux'},{txt:'not',cls:'not'},{txt:v,cls:'verb'},{txt:o,cls:'obj'}]:
        [{txt:a,cls:'aux'},{txt:s,cls:'subject'},{txt:v,cls:'verb'},{txt:o,cls:'obj'}];
    parts.forEach(p=>{
        const d=document.createElement('div');
        d.className='slot '+p.cls;
        d.textContent=p.txt;
        if(p.cls!=='not'){
            d.onclick=()=>{cycle(p.cls);};
        }
        arena.appendChild(d);
    });
}
function cycle(cat){
    const list=data[cat];
    selection[cat]=(selection[cat]+1)%list.length;
    renderSentence();
}

/* ---------- STEP 3 ---------- */
function loadError(){
    const e=errors[errIdx];
    const line = e.arr.map((w,i)=>`<span class="bad-word" data-idx="${i}">${w}</span>`).join(' ');
    document.getElementById('mistake-sentence').innerHTML=line;
    document.getElementById('explain').style.display='none';
    document.getElementById('nextErr').style.display='none';
    document.querySelectorAll('.bad-word').forEach(el=>{
        el.onclick=()=>{
            const idx=parseInt(el.dataset.idx);
            if(idx===e.wrong){
                el.classList.add('correct');
                document.getElementById('explain').innerHTML=`✅ ${e.msg} The correct word is <strong>${e.correct}</strong>.`;
            }else{
                el.classList.add('wrong');
                document.getElementById('explain').innerHTML=`❌ That’s not the error. Try again.`;
            }
            document.getElementById('explain').style.display='block';
            if(idx===e.wrong) document.getElementById('nextErr').style.display='inline-block';
        };
    });
}
function nextError(){
    errIdx=(errIdx+1)%errors.length;
    loadError();
}

/* ---------- STEP 4 ---------- */
function loadScramble(){
    const ch=scrambles[scrambleIdx];
    const pool=document.getElementById('pool');
    const ans=document.getElementById('answer');
    const trash=document.getElementById('trash');
    pool.innerHTML=''; ans.innerHTML=''; trash.innerHTML=''; document.getElementById('scramble-feedback').textContent='';
    ch.words.sort(()=>Math.random()-0.5).forEach(w=>{
        const t=document.createElement('div');
        t.className='scramble-tile';
        t.textContent=w;
        t.onclick=()=>moveTile(t);
        pool.appendChild(t);
    });
}
function moveTile(tile){
    const pool=document.getElementById('pool');
    const ans=document.getElementById('answer');
    const trash=document.getElementById('trash');
    if(pool.contains(tile)){
        // decide where to place: if it's the intruder, send to trash; otherwise to answer
        const cur=scrambles[scrambleIdx];
        if(tile.textContent===cur.intruder){
            trash.appendChild(tile);
        }else{
            ans.appendChild(tile);
        }
    }else if(ans.contains(tile)){
        pool.appendChild(tile);
    }else if(trash.contains(tile)){
        // allow moving back to pool (useful for corrections)
        pool.appendChild(tile);
    }
}
function checkScramble(){
    const cur=scrambles[scrambleIdx];
    const ansArr=[...document.getElementById('answer').children].map(t=>t.textContent);
    const trashArr=[...document.getElementById('trash').children].map(t=>t.textContent);
    const correct = ansArr.join(' ')===cur.correct.join(' ') && trashArr.includes(cur.intruder);
    document.getElementById('scramble-feedback').textContent=correct?'✅ Correct!':'❌ Not quite. Try rearranging again.';
    if(correct){
        scrambleIdx=(scrambleIdx+1)%scrambles.length;
    }
}

/* ---------- INITIALISE ---------- */
initStep1();          // Step 1 words
renderSentence();    // default view for Step 2
</script>
</body>
</html>
